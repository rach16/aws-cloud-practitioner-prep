<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#232F3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLF cards">
<link rel="manifest" href="manifest.json">
<title>CLF-C02 flashcards</title>
<style>
  :root {
    --bg: #F2F3F3; --card: #FFFFFF; --ink: #16191F; --muted: #545B64; --line: #D5DBDB;
    --aws: #FF9900; --navy: #232F3E; --good: #1D8102; --bad: #D13212; --chip: #E9EBED;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F1B2A; --card: #1B2A3B; --ink: #F2F3F3; --muted: #AAB7B8; --line: #2C3E50; --chip: #23364A; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  .app { max-width: 560px; margin: 0 auto; padding: 12px 16px 20px; display: flex; flex-direction: column; min-height: 100vh; gap: 10px; }
  header { display: flex; align-items: baseline; justify-content: space-between; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  header h1 span { color: var(--aws); }
  header .count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer;
  }
  .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  @media (prefers-color-scheme: dark) { .chip.on { background: var(--aws); color: var(--navy); border-color: var(--aws); } }
  .domain { font-size: 14px; color: var(--muted); }
  .domain b { color: var(--ink); font-weight: 600; }
  .stats { display: flex; gap: 14px; color: var(--muted); font-size: 13px; }
  .stats b { color: var(--ink); font-weight: 600; }
  .card {
    flex: 1; display: flex; flex-direction: column; min-height: 46vh;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06); cursor: pointer; position: relative;
  }
  .card .topic { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
  .card .topic i { font-style: normal; color: var(--aws); font-weight: 700; margin-right: 6px; }
  .card .text { flex: 1; display: flex; align-items: center; font-size: 20px; line-height: 1.4; }
  .card.back .text { font-size: 18px; }
  .card .hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; }
  .card.back { border-left: 5px solid var(--aws); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions.one { grid-template-columns: 1fr; }
  button.big {
    border: 0; border-radius: 12px; padding: 16px; font-size: 17px; font-weight: 600; cursor: pointer; color: #fff;
  }
  .flip { background: var(--navy); }
  .miss { background: var(--bad); }
  .got { background: var(--good); }
  .tools { display: flex; gap: 14px; justify-content: center; font-size: 13px; }
  .tools a { color: var(--muted); text-decoration: underline; cursor: pointer; }
  .done { text-align: center; }
  .done h2 { margin: 0 0 8px; }
  .done p { color: var(--muted); margin: 0 0 16px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span>CLF-C02</span> flashcards</h1>
    <div class="count" id="count"></div>
  </header>

  <div class="chips" id="domains">
    <button class="chip on" data-d="0">All domains</button>
    <button class="chip" data-d="1">1 Concepts</button>
    <button class="chip" data-d="2">2 Security</button>
    <button class="chip" data-d="3">3 Services</button>
    <button class="chip" data-d="4">4 Billing</button>
    <button class="chip" data-d="5">Terms</button>
    <button class="chip" id="missedOnly">Missed only</button>
  </div>

  <div class="domain" id="domainName"></div>
  <div class="stats" id="stats"></div>

  <div class="card" id="card">
    <div class="topic" id="topic"></div>
    <div class="text" id="text"></div>
    <div class="hint" id="hint">Tap to reveal</div>
  </div>

  <div class="actions one" id="actions">
    <button class="big flip" id="btnFlip">Show answer</button>
    <button class="big miss hidden" id="btnMiss">Missed</button>
    <button class="big got hidden" id="btnGot">Got it</button>
  </div>

  <div class="tools">
    <a id="shuffle">Shuffle</a>
    <a id="reset">Reset progress</a>
  </div>
</div>

<script src="cards.js"></script>
<script>
(function () {
  var KEY = "clf-cards-v1";
  var DOMAINS = {
    0: ["All four exam domains", ""],
    1: ["Domain 1: Cloud Concepts", "24% of the exam"],
    2: ["Domain 2: Security and Compliance", "30% of the exam"],
    3: ["Domain 3: Cloud Technology and Services", "34% of the exam"],
    4: ["Domain 4: Billing, Pricing and Support", "12% of the exam"],
    5: ["Common terms and definitions", "every domain, learn these first"]
  };
  var cards = window.CARDS.map(function (c, i) { c.id = hash(c.q); return c; });
  var state = load();           // id -> {s: "got" | "missed", n: times seen}
  var domain = 0, missedOnly = false;
  var queue = [], pos = 0, flipped = false, sessionGot = 0, sessionMissed = 0;

  var el = {};
  ["count","stats","domainName","card","topic","text","hint","actions","btnFlip","btnMiss","btnGot","shuffle","reset","missedOnly","domains"]
    .forEach(function (id) { el[id] = document.getElementById(id); });

  function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function status(c) { var s = state[c.id]; return s ? s.s : "new"; }

  function pool() {
    return cards.filter(function (c) {
      if (domain === 0 && c.d === 5) return false;   // "All domains" leaves the Terms deck out
      if (domain && c.d !== domain) return false;
      if (missedOnly && status(c) !== "missed") return false;
      return true;
    });
  }

  // Missed cards first, then unseen, then known. Shuffled within each group.
  function build() {
    var p = pool();
    var missed = shuffle(p.filter(function (c) { return status(c) === "missed"; }));
    var fresh  = shuffle(p.filter(function (c) { return status(c) === "new"; }));
    var known  = shuffle(p.filter(function (c) { return status(c) === "got"; }));
    queue = missed.concat(fresh, known);
    pos = 0; sessionGot = 0; sessionMissed = 0;
    render();
  }

  function render() {
    var p = pool();
    var dn = DOMAINS[domain];
    el.domainName.innerHTML = "<b>" + dn[0] + "</b> &middot; " + (dn[1] || p.length + " cards");
    var m = 0, n = 0, g = 0;
    p.forEach(function (c) { var s = status(c); if (s === "missed") m++; else if (s === "new") n++; else g++; });
    el.stats.innerHTML = "<span>missed <b>" + m + "</b></span><span>unseen <b>" + n + "</b></span><span>got <b>" + g + "</b></span>";

    if (!queue.length) {
      el.count.textContent = "";
      el.card.className = "card done";
      el.topic.textContent = "";
      el.text.innerHTML = "<div class='done'><h2>Nothing here</h2><p>" + (missedOnly ? "No missed cards in this domain. Good." : "No cards match.") + "</p></div>";
      el.hint.textContent = "";
      el.actions.className = "actions one hidden";
      return;
    }
    if (pos >= queue.length) {
      el.count.textContent = queue.length + " / " + queue.length;
      el.card.className = "card done";
      el.topic.textContent = "";
      el.text.innerHTML = "<div class='done'><h2>Deck done</h2><p>Got " + sessionGot + ", missed " + sessionMissed + ".</p></div>";
      el.hint.textContent = "Tap to go again";
      el.actions.className = "actions one hidden";
      return;
    }
    var c = queue[pos];
    flipped = false;
    el.count.textContent = (pos + 1) + " / " + queue.length;
    el.card.className = "card";
    el.topic.innerHTML = "<i>" + (c.d === 5 ? "Term" : "Domain " + c.d) + "</i>" + esc(c.t) + (status(c) === "missed" ? " &middot; missed before" : "");
    el.text.textContent = c.q;
    el.hint.textContent = "Tap to reveal";
    el.actions.className = "actions one";
    el.btnFlip.classList.remove("hidden");
    el.btnMiss.classList.add("hidden");
    el.btnGot.classList.add("hidden");
  }

  function flip() {
    if (pos >= queue.length) { build(); return; }
    if (flipped) return;
    flipped = true;
    var c = queue[pos];
    el.card.className = "card back";
    el.text.textContent = c.a;
    el.hint.textContent = "";
    el.actions.className = "actions";
    el.btnFlip.classList.add("hidden");
    el.btnMiss.classList.remove("hidden");
    el.btnGot.classList.remove("hidden");
  }

  function mark(s) {
    if (!flipped) return;
    var c = queue[pos];
    var prev = state[c.id] || { n: 0 };
    state[c.id] = { s: s, n: prev.n + 1 };
    save();
    if (s === "got") sessionGot++; else sessionMissed++;
    pos++;
    render();
  }

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  el.card.addEventListener("click", flip);
  el.btnFlip.addEventListener("click", flip);
  el.btnMiss.addEventListener("click", function () { mark("missed"); });
  el.btnGot.addEventListener("click", function () { mark("got"); });
  el.shuffle.addEventListener("click", function () { queue = shuffle(queue.slice()); pos = 0; sessionGot = 0; sessionMissed = 0; render(); });
  el.reset.addEventListener("click", function () {
    if (!confirm("Forget every got / missed mark?")) return;
    state = {}; save(); build();
  });
  el.missedOnly.addEventListener("click", function () {
    missedOnly = !missedOnly;
    el.missedOnly.classList.toggle("on", missedOnly);
    build();
  });
  el.domains.addEventListener("click", function (e) {
    var b = e.target.closest("[data-d]");
    if (!b) return;
    domain = +b.dataset.d;
    Array.prototype.forEach.call(el.domains.querySelectorAll("[data-d]"), function (x) { x.classList.toggle("on", x === b); });
    build();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "ArrowUp") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowLeft") mark("missed");
    else if (e.key === "ArrowRight") mark("got");
  });

  // Swipe: left = missed, right = got, once the answer is showing.
  var sx = null;
  el.card.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  el.card.addEventListener("touchend", function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) < 60) return;
    if (dx < 0) mark("missed"); else mark("got");
  }, { passive: true });

  build();
})();
</script>
</body>
</html>
